  <script>
    // PriceHop Extension Bridge for Flutter Web.
    // The extension hosts hidden "scraper tabs" that stand in for the mobile
    // app's HeadlessInAppWebView. Payloads cross into Dart as JSON strings.
    window.pricehopExt = (function () {
      var pending = {};
      var api = {
        available: function () {
          return document.documentElement.hasAttribute('data-pricehop-ext');
        },
        // Set from Dart: receives each scraper-tab event as a JSON string.
        onEvent: null,
        call: function (method, paramsJson, timeoutMs) {
          return new Promise(function (resolve) {
            if (!api.available()) {
              return resolve(JSON.stringify({ ok: false, error: 'Extension not installed' }));
            }
            var id = 'rpc_' + Math.random().toString(36).substring(2) + '_' + Date.now();
            pending[id] = resolve;
            setTimeout(function () {
              if (pending[id]) {
                delete pending[id];
                resolve(JSON.stringify({ ok: false, error: 'Timed out' }));
              }
            }, timeoutMs || 15000);
            window.postMessage({ type: 'PRICEHOP_RPC', id: id, method: method, params: JSON.parse(paramsJson) }, '*');
          });
        }
      };
      window.addEventListener('message', function (e) {
        if (e.source !== window || !e.data) return;
        if (e.data.type === 'PRICEHOP_RPC_RESULT' && pending[e.data.id]) {
          var resolve = pending[e.data.id];
          delete pending[e.data.id];
          resolve(JSON.stringify({ ok: e.data.ok, result: e.data.result, error: e.data.error }));
        } else if (e.data.type === 'PRICEHOP_TAB_EVENT' && api.onEvent) {
          api.onEvent(JSON.stringify(e.data));
        }
      });
      return api;
    })();
  </script>
